name: Deploy mobile web to GitHub Pages

# Compila la vista web de Connect-it (mobile/, via react-native-web + expo
# export -p web) y la publica en la rama gh-pages cada vez que cambia algo
# en mobile/ en main. Es solo para poder ver/probar la app sin depender de
# un build local o de EAS — no sustituye a las apps nativas.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-web.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Export web build
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: npx expo export -p web

      - name: SPA fallback for GitHub Pages
        # GitHub Pages sirve archivos estáticos tal cual: si alguien entra
        # directo a /web-landing-hub/welcome (o recarga esa URL), no existe
        # ese archivo físico y da 404 en vez de dejar que expo-router
        # resuelva la ruta en el cliente. Copiar index.html a 404.html es
        # el truco estándar para SPAs en GitHub Pages: ante cualquier ruta
        # desconocida, sirve el mismo shell de la app y el router de
        # expo-router toma el control desde ahí.
        working-directory: mobile
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/dist
